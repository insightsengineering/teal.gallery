# This workflow has been refactored into reusable and caller workflows.
# See deploy-reusable.yml, deploy-main.yml, and deploy-dev.yml for the new structure.
#
# The deployment logic is now:
# - deploy-main.yml: Triggers on main branch, calls deploy-reusable.yml with channel=stable
# - deploy-dev.yml: Triggers on dev branch, calls deploy-reusable.yml with channel=dev
# - deploy-reusable.yml: Contains the actual deployment job logic
#
# This separation ensures DRY (Don't Repeat Yourself) principle and makes it easier
# to manage deployments to different environments.
